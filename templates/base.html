{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Neon · VALORANT hayran sitesi{% endblock %}</title>
  <meta name="description" content="VALORANT ajanı Neon: yetenekleri, hikâyesi ve görselleri. Hayran yapımı site.">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231fd2ff' d='M19 2 6 18h8l-3 12 15-18h-8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script>
    document.documentElement.classList.add('js');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');
  </script>
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{% static 'js/vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/vendor/ScrollTrigger.min.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
